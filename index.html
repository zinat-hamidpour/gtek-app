<title>GTEK · ورود</title>

<style>
:root{--paper:#EDEAE3;--ink:#1B1A19;--deck:#FAF8F4;--grey:#55524E}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--paper);overflow:hidden}
body{font-family:Vazirmatn,system-ui,sans-serif;color:var(--ink)}
#fit{position:fixed;left:50%;top:0;width:390px;transform-origin:top center}
#stage{position:relative;width:390px;overflow:hidden;background:var(--paper)}
.grain{position:absolute;inset:0;width:100%;height:100%;opacity:.26;pointer-events:none}
.ly{position:absolute;left:0;bottom:0;will-change:transform;overflow:visible}
#line{position:absolute;top:0;width:2px;margin-left:-1px;background:#1B1A19;box-shadow:0 0 0 .75px rgba(250,248,244,.75);transform-origin:top center;transform:scaleY(0)}
#discW{position:absolute;width:68px;height:68px;margin:-34px 0 0 -34px;will-change:transform}
#disc{width:68px;height:68px;border-radius:50%;background:#E8341C;will-change:transform}
.ring{position:absolute;border-radius:50%;pointer-events:none;opacity:0}
#ping{width:84px;height:84px;margin:-42px 0 0 -42px;border:1.5px dashed var(--deck)}
#gap{position:absolute;width:27px;height:27px;margin:-13.5px 0 0 -13.5px;border-radius:50%;background:var(--paper);opacity:0}
#logo{position:absolute;left:89px;width:212px;height:80.4px;direction:ltr}
#logo svg{position:absolute;left:0;top:0;overflow:visible}
#logo{clip-path:circle(0px at 74.1px 67.7px);will-change:clip-path}
#rad{position:absolute;width:420px;height:420px;margin:-210px 0 0 -210px;pointer-events:none;overflow:visible}
#rad circle{fill:none;vector-effect:non-scaling-stroke;transform-box:fill-box;transform-origin:center;opacity:0}
#blast{position:absolute;width:420px;height:420px;margin:-210px 0 0 -210px;pointer-events:none;overflow:visible}
#blast circle{fill:none;vector-effect:non-scaling-stroke;transform-box:fill-box;transform-origin:center;opacity:0}
#tag{position:absolute;left:0;right:0;text-align:center;font-size:13.5px;color:var(--grey);opacity:0}
#side{position:absolute;left:18px;top:26px;writing-mode:vertical-rl;direction:ltr;font-family:'IBM Plex Mono',monospace;font-size:8.5px;letter-spacing:.24em;color:var(--grey)}
form{position:absolute;left:60px;width:270px;display:flex;flex-direction:column;gap:20px;opacity:0}
label{display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:var(--grey)}
input{font:inherit;font-size:17px;color:var(--ink);background:transparent;border:0;border-bottom:1px solid var(--ink);border-radius:0;padding:6px 0 8px;outline:none;direction:ltr;text-align:right}
input:focus{border-bottom-width:2px;padding-bottom:7px}
button.go{position:absolute;left:0;width:390px;height:64px;border:0;background:transparent;font:inherit;font-weight:600;font-size:19px;color:var(--ink);cursor:pointer;padding:0 60px;display:flex;align-items:center;justify-content:flex-end;gap:12px;opacity:0}
button.go span{position:relative}
button.go .seed{width:44px;height:44px;border-radius:50%;background:#D8261C;display:grid;place-items:center;transition:transform .15s}
button.go:active .seed{transform:scale(.92)}
button.go:focus-visible, #again:focus-visible{outline:2px solid var(--ink);outline-offset:-6px}
#again{position:absolute;right:16px;top:18px;border:0;background:transparent;font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.12em;color:var(--grey);padding:10px;cursor:pointer;opacity:0}
#msg{min-height:18px;font-size:12px;color:var(--grey);text-align:center;margin-top:-10px}
</style>
</head>

<script>
(function(){
var $=function(i){return document.getElementById(i)};
var fit=$('fit'),stage=$('stage'),anims=[],H=844,DX=163.1,CY=67.7,RS=0.344,DR=11.7;
var tops=[430,520,600,690,770], rest=[716,748,778,806,830];
function layout(){
  var s=Math.min(innerWidth/390, innerHeight/720, 1.3);
  H=Math.round(innerHeight/s);
  fit.style.transform='translateX(-50%) scale('+s+')';
  stage.style.height=H+'px';
  var lt=Math.max(104,Math.min(190,H*0.19));
  $('logo').style.top=lt+'px';
  $('tag').style.top=(lt+100)+'px';
  $('f').style.top=(lt+146)+'px';
  var bt=lt+322; $('go').style.top=(bt+12)+'px';
  var yD=H-844+686, yT=lt+CY;
  [['discW',yD],['rad',yD],['blast',yT]].forEach(function(a){var e=$(a[0]);e.style.left=DX+'px';e.style.top=a[1]+'px'});
  var ln=$('line'); ln.style.left=DX+'px'; ln.style.height=(yD-34)+'px';
  return {yD:yD,yT:yT,bt:bt};
}
function A(el,kf,o){o.fill=o.fill||'both';var a=el.animate(kf,o);anims.push(a);return a}
function play(){
  anims.forEach(function(a){a.cancel()}); anims=[];
  var g=layout(), out='cubic-bezier(.16,1,.3,1)', johakyu='cubic-bezier(.7,0,.16,1)';
  var reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
  
  var io='cubic-bezier(.45,0,.25,1)';
  // 1 — the plumb line comes down onto the visible cap of the pellet
  var ln=$('line'), LH=g.yD-34, k2=(g.yT-DR)/LH;
  A(ln,[{transform:'scaleY(0)'},{transform:'scaleY(1)'}],{delay:500,duration:1000,easing:'cubic-bezier(.5,0,.2,1)'});
  // 2 — impact: the ground answers, red radiation spreads from the pellet
  var I=1500;
  for(var i=0;i<5;i++){
    A($('L'+(i+1)),[{transform:'translateY(0)'},{transform:'translateY(-3px)',offset:.18},{transform:'translateY(2px)',offset:.45},{transform:'translateY(-1px)',offset:.7},{transform:'translateY(0)'}],{delay:I+i*35,duration:620,easing:'ease-out',fill:'none'});
  }
  [['r0',0,6.5,.3],['r0',900,5,.2],['r1',0,7.5,1],['r2',260,6.2,.85],['r3',540,5,.8],['r4',820,3.8,.7],['r1',1250,5.5,.6],['r3',1600,4.2,.5]].forEach(function(r){
    A($(r[0]),[{opacity:0,transform:'scale(0)'},{opacity:r[3],offset:.12},{opacity:r[3]*.55,offset:.6},{opacity:0,transform:'scale('+r[2]+')'}],{delay:I+r[1],duration:1700,easing:'cubic-bezier(.2,.5,.3,1)',fill:'none'});
  });
  // 3 — one unbroken rise: the pellet shrinks and darkens all the way up
  var T=I+250, D=2900, rise='cubic-bezier(.5,0,.25,1)';
  A($('disc'),[{transform:'translateY(0) scale(1)',background:'#E8341C'},{transform:'translateY('+(g.yT-g.yD)+'px) scale('+RS+')',background:'#8F0504'}],{delay:T,duration:D,easing:rise});
  A(ln,[{transform:'scaleY(1)'},{transform:'scaleY('+k2+')'}],{delay:T,duration:D,easing:rise,fill:'forwards'});
  A(ln,[{transform:'scaleY('+k2+')'},{transform:'scaleY(0)'}],{delay:T+D+60,duration:420,easing:'ease-in',fill:'forwards'});
  // 4 — three things at once: logo forms, layers come down to the button line, form fades in
  var B=T+D-60, BD=2200, be='cubic-bezier(.3,.25,.3,1)';
  A($('logo'),[{clipPath:'circle(0px at '+(DX-89)+'px '+CY+'px)'},{clipPath:'circle(162px at '+(DX-89)+'px '+CY+'px)'}],{delay:B,duration:BD,easing:be});
  [['b1',0,8.1,.55],['b2',300,5.6,.45]].forEach(function(r){
    A($(r[0]),[{opacity:0,transform:'scale(0)'},{opacity:r[3],offset:.1},{opacity:r[3]*.6,offset:.6},{opacity:0,transform:'scale('+r[2]+')'}],{delay:B+r[1],duration:BD,easing:be});
  });
  var restTop=[g.bt,g.bt+86,g.bt+130,g.bt+170,g.bt+208];
  for(var j=0;j<5;j++){
    var dy=Math.max(0,restTop[j]-(H-844+tops[j]));
    A($('L'+(j+1)),[{transform:'translateY(0)'},{transform:'translateY('+dy+'px)'}],{delay:B+j*60,duration:BD-240,easing:'cubic-bezier(.6,0,.2,1)',fill:'forwards'});
  }
  A($('tag'),[{opacity:0},{opacity:1}],{delay:B+500,duration:BD-700});
  A($('f'),[{opacity:0},{opacity:1}],{delay:B+850,duration:BD-950,easing:'ease-in-out'});
  A($('go'),[{opacity:0},{opacity:1}],{delay:B+BD-900,duration:800});
  A($('again'),[{opacity:0},{opacity:1}],{delay:B+BD+300,duration:500});
  if(reduce) anims.forEach(function(a){a.finish()});
  var q=/[?&]t=(\d+)/.exec(location.search); if(q) anims.forEach(function(a){a.pause();a.currentTime=+q[1]});
}
function skip(){anims.forEach(function(a){if(a.playState!=='finished')a.finish()})}
stage.addEventListener('pointerdown',function(e){if(!e.target.closest('form,#again,.go'))skip()});
$('again').addEventListener('click',play);
$('f').addEventListener('submit',function(e){e.preventDefault();
  /* Skeleton: no real sign-in yet (SMS code comes with the real app). Go to the skills page. */
  document.body.animate([{opacity:1},{opacity:0}],{duration:420,easing:'cubic-bezier(.6,0,.2,1)',fill:'forwards'}).onfinish=function(){location.href='skills.html'};
});
var rt;addEventListener('resize',function(){clearTimeout(rt);rt=setTimeout(function(){layout();},150)});
play();
})();
</script>
