<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1B1A19">
<title>GTEK · نمایه</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<body>
<main class="app"><div class="screen-full" id="screen"></div>
  <div class="section"><div class="section-head"><span>نمونهٔ آزمایشی</span></div>
    <div style="display:flex;gap:10px;flex-wrap:wrap">
    <button class="capsule secondary" id="reset" type="button" style="width:auto;padding:0 20px">پاک کردن پیشرفت آزمایشی</button>
    <button class="capsule secondary" id="signout" type="button" style="width:auto;padding:0 20px">خروج از حساب</button>
    </div>
  </div></main>
<script src="assets/js/data.js"></script>
<script src="assets/js/core.js"></script>
<script src="assets/js/dc-lite.js"></script>
<script>
App.loadScreen('Intro', function (sc) { mountScreen(sc, document.getElementById('screen')); });
App.nav('profile');
var r = document.getElementById('reset');
if (r) r.addEventListener('click', function () { App.reset(); r.textContent = 'پاک شد'; });
document.getElementById('signout').addEventListener('click', App.signOut);
</script>
