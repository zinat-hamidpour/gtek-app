<div style="position: absolute; left: 0; right: 0; top: 352px; bottom: 0; background: #2B2A29; color: #FAF8F4">
<svg width="390" height="16" viewBox="0 0 390 16" aria-hidden="true" style="position: absolute; left: 0; top: -12px"><path d="{{floorW}}" style="fill: #FAF8F4"></path><path d="{{floorC}}" style="fill: #2B2A29"></path></svg>
<span aria-hidden="true" style="position: absolute; left: 135px; top: 18px; width: 120px; height: 22px; border-radius: 50%; background: #D8261C"></span>
<div style="position: absolute; left: 28px; right: 28px; top: 74px; display: flex; flex-direction: column; gap: 10px; align-items: flex-start">
<span style="font-size: 12.5px; color: #C6C2BA">{{spec}}</span>
<p style="margin: 0; font-size: 15px; line-height: 1.8">{{status}}</p>
<sc-if value="{{hasNote}}" hint-placeholder-val="{{ true }}">
<div style="display: flex; flex-direction: column; gap: 2px; margin-top: 2px">
<span style="font-size: 12.5px; color: #C6C2BA">یادداشت مربی بر نسخهٔ ۱</span>
<p style="margin: 0; font-size: 14px; line-height: 1.8; color: #E2DED7">{{note}}</p>
</div>
</sc-if>
<button type="button" style="margin-top: 8px; height: 44px; padding: 0 22px; border-radius: 22px; background: #FAF8F4; color: #1B1A19; font-size: 14px; font-weight: 400">{{action}}</button>
</div>
<p style="position: absolute; left: 28px; right: 28px; bottom: 116px; margin: 0; font-size: 12.5px; line-height: 1.8; color: #A8A49D">پرده‌ها ۴۸ ساعت پیش از رویداد قفل می‌شوند · ۱۲ روز مانده</p>
</div>

<svg width="390" height="844" aria-hidden="true" style="position: absolute; left: 0; top: 0; pointer-events: none; opacity: 0.22">
<defs><filter id="gtekGrainS" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency="0.7" numOctaves="3" seed="11"></feTurbulence><feColorMatrix type="matrix" values="0 0 0 0 0.25  0 0 0 0 0.23  0 0 0 0 0.2  5 0 0 0 -3"></feColorMatrix></filter></defs>
<rect width="390" height="844" style="fill: transparent; filter: url(#gtekGrainS)"></rect>
</svg>



</div>

<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
var self = this;
var sel = (this.state && this.state.sel) || 'c';
function rng(seed) { var s = seed; return function () { s = (s * 16807) % 2147483647; return s / 2147483647; }; }
function rect(w, h, seed) {
var r = rng(seed), p = [], x, y, a = 2.2;
for (x = 0; x < w; x += 6) p.push(x.toFixed(1) + ',' + (r() * a).toFixed(1));
for (y = 0; y < h; y += 6) p.push((w - r() * a).toFixed(1) + ',' + y.toFixed(1));
for (x = w; x > 0; x -= 6) p.push(x.toFixed(1) + ',' + (h - r() * a).toFixed(1));
for (y = h; y > 0; y -= 6) p.push((r() * a).toFixed(1) + ',' + y.toFixed(1));
return p.join(' ');
}
function tear(seed, off) {
var r = rng(seed), amp = 8, y = amp / 2, d = 'M0,' + (y + off).toFixed(1), x = 0;
while (x < 390) {
x = Math.min(390, x + 4.5 + r() * 3);
y = Math.max(0, Math.min(amp, y + (r() - 0.5) * amp * 0.7));
d += ' L' + x.toFixed(1) + ',' + (y + off).toFixed(1);
}
return d + ' L390,16 L0,16 Z';
}
var info = {
r: { spec: 'پردهٔ راست · عمودی ۱۰۸۰×۱۹۲۰', status: 'نسخهٔ ۳ تأیید شده است.', note: '', action: 'دیدن نسخه' },
c: { spec: 'پردهٔ میانی · افقی ۱۹۲۰×۱۰۸۰', status: 'نسخهٔ ۲ نزد مربی است؛ پاسخ تا ۴۸ ساعت.', note: 'عنوان را کوتاه‌تر کنید؛ از ردیف آخر سالن خوانده نمی‌شود.', action: 'بارگذاری نسخهٔ تازه' },
l: { spec: 'پردهٔ چپ · عمودی ۱۰۸۰×۱۹۲۰', status: 'هنوز فایلی بارگذاری نکرده‌اید.', note: '', action: 'بارگذاری' }
};
var lift = 'translateY(-8px)', rest = 'translateY(0)';
var sh = 'drop-shadow(0 14px 12px rgba(20,19,19,0.32))', none = 'none';
var pick = function (k) { return function () { self.setState({ sel: k }); }; };
var i = info[sel];
return {
spec: i.spec, status: i.status, note: i.note, hasNote: !!i.note, action: i.action,
tfR: sel === 'r' ? lift : rest, tfC: sel === 'c' ? lift : rest, tfL: sel === 'l' ? lift : rest,
shR: sel === 'r' ? sh : none, shC: sel === 'c' ? sh : none, shL: sel === 'l' ? sh : none,
pR: sel === 'r' ? 'true' : 'false', pC: sel === 'c' ? 'true' : 'false', pL: sel === 'l' ? 'true' : 'false',
selR: pick('r'), selC: pick('c'), selL: pick('l'),
portR: rect(64, 114, 23), portL: rect(64, 114, 71), land: rect(166, 94, 45),
floorW: tear(140, 0), floorC: tear(140, 4)
};
}
}
</script>
